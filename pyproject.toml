[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stem-research-agents"
version = "0.1.0"
description = "Verifiable multi-step agentic workflows for quantitative and mathematical reasoning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lorrany Araujo Nascentes", email = "nascenteslorrany@gmail.com" }]
dependencies = ["pydantic>=2.6", "sympy>=1.12", "numpy>=1.26"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
langgraph = ["langgraph>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]
